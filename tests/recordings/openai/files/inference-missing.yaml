# Synthetic upload conversation; no live provider capture.
---
schema: neoagent-http-recording
version: 1
type: exchange
operation: fetch
request:
  method: POST
  url: https://api.openai.com/v1/responses
  headers:
    Authorization: Bearer upload-replay-key
    Content-Type: application/json
    Accept: text/event-stream
  body:
    model: gpt-4.1
    stream: true
    input:
      - role: user
        content:
          - type: input_text
            text: Inspect the sample tile.
      - type: function_call
        call_id: call-tile
        name: sample_tile
        arguments: '{}'
      - type: function_call_output
        call_id: call-tile
        output:
          - type: input_text
            text: Generated tile.
          - type: input_image
            file_id: file-tile
            detail: auto
          - type: input_image
            file_id: file-tile
            detail: auto
      - role: user
        content:
          - type: input_text
            text: Describe the tile.
      - type: message
        role: assistant
        status: completed
        id: msg-tile
        content:
          - type: output_text
            text: One pixel.
            annotations: []
      - role: user
        content:
          - type: input_text
            text: Describe it again.
    store: false
  body_format: json
---
type: response_chunk
index: 1
at_us: 1000
bytes: 125
---
type: response_body
at_us: 4000
bytes: 125
body:
  error:
    message: Image file was not found
    type: invalid_request_error
    param: input
    code: image_file_not_found
body_format: json
---
type: response
at_us: 4000
status: 400
headers:
  content-type: application/json
---
type: complete
at_us: 4000
ok: true
