name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  typecheck:
    name: EmmyLua type checking
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: |
            .deps/emmylua
            .deps/typecheck
          key: typecheck-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/typecheck_deps.py') }}
      - name: Install pinned checker and definitions
        run: make typecheck-deps
      - name: Check Lua types
        run: make typecheck

  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        neovim: [v0.10.2, stable, nightly]
    env:
      NVIM: nvim
      NEOAGENT_REQUIRE_SANDBOX: "1"
      PLENARY_DIR: ${{ github.workspace }}/.deps/plenary.nvim
    steps:
      - uses: actions/checkout@v5
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim }}
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ripgrep fd-find python3
          mkdir -p "$HOME/.local/bin"
          ln -s "$(command -v fdfind)" "$HOME/.local/bin/fd"
          curl --fail --location --show-error --silent \
            https://github.com/mikefarah/yq/releases/download/v4.53.6/yq_linux_amd64 \
            --output "$HOME/.local/bin/yq"
          echo "c5f056448f973ae7d39b5401949648a78f2dc1947d6a8eb65be60d5c504b9385  $HOME/.local/bin/yq" \
            | sha256sum --check
          chmod +x "$HOME/.local/bin/yq"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Enable unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install pinned test dependencies
        run: make deps
      - name: Run all suites with coverage
        if: matrix.neovim == 'stable'
        run: make coverage-ci
      - name: Run compatibility suite
        if: matrix.neovim != 'stable'
        run: make test test-http-live test-native-sandbox
      - name: Check container, transcript, and submission performance budgets
        if: matrix.neovim == 'stable'
        run: make benchmark-applet benchmark-transcript benchmark-submission

  terminal-images:
    name: terminal images (Linux, stable)
    runs-on: ubuntu-24.04
    env:
      NVIM: nvim
      PLENARY_DIR: ${{ github.workspace }}/.deps/plenary.nvim
    steps:
      - uses: actions/checkout@v5
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - name: Install terminal image test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl imagemagick konsole python3 tmux xauth xvfb
          mkdir -p .deps/kitty
          curl --fail --location --show-error --silent \
            https://github.com/kovidgoyal/kitty/releases/download/v0.48.2/kitty-0.48.2-x86_64.txz \
            --output "$RUNNER_TEMP/kitty.txz"
          echo "967a1958e7fc67b495d279c0963bcd1a0482097151817ce6506fabc822689af7  $RUNNER_TEMP/kitty.txz" \
            | sha256sum --check
          tar -xJf "$RUNNER_TEMP/kitty.txz" -C .deps/kitty
          test -x .deps/kitty/bin/kitty
          command -v import
          command -v tmux
          command -v konsole
          command -v xvfb-run
          echo "KITTY=$GITHUB_WORKSPACE/.deps/kitty/bin/kitty" >> "$GITHUB_ENV"
      - name: Install pinned test dependencies
        run: make deps
      - name: Run terminal image suite
        run: make test-terminal-images

  test-macos:
    name: test (macOS, stable)
    runs-on: macos-14
    env:
      NVIM: nvim
      NEOAGENT_REQUIRE_SANDBOX: "1"
      PLENARY_DIR: ${{ github.workspace }}/.deps/plenary.nvim
    steps:
      - uses: actions/checkout@v5
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - name: Install system dependencies
        run: brew install ripgrep fd yq
      - name: Install pinned test dependencies
        run: make deps
      - name: Run fast and host suites
        run: make test test-http-live test-native-sandbox

  test-windows:
    name: test (Windows, stable)
    runs-on: windows-2022
    env:
      PLENARY_DIR: ${{ github.workspace }}\.deps\plenary.nvim
    steps:
      - uses: actions/checkout@v5
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - name: Install pinned test dependency
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .deps | Out-Null
          git clone https://github.com/nvim-lua/plenary.nvim.git .deps/plenary.nvim
          git -C .deps/plenary.nvim checkout 74b06c6c75e4eeb3108ec01852001636d85a932b
      - name: Check statement layout
        shell: pwsh
        run: |
          nvim --headless -u NONE -i NONE -l scripts/check_statement_layout.lua
          if ($LASTEXITCODE -ne 0) { throw "Statement layout check failed" }
      - name: Provision Windows sandbox identities and policy
        shell: pwsh
        run: |
          $state = Join-Path $env:RUNNER_TEMP "neoagent-windows-sandbox"
          $nvim = (Get-Command nvim).Source
          $script = (Resolve-Path "scripts/sandbox_windows_runtime.lua").Path
          $env:NEOAGENT_WINDOWS_SANDBOX_STATE = $state
          "NEOAGENT_WINDOWS_SANDBOX_STATE=$state" >> $env:GITHUB_ENV
          "NEOAGENT_NVIM=$nvim" >> $env:GITHUB_ENV
          & $nvim --headless -u NONE -i NONE -n `
            -l $script -- --setup
          if ($LASTEXITCODE -ne 0) { throw "sandbox setup failed" }
      - name: Run Windows sandbox suite
        shell: pwsh
        run: |
          # Fresh sandbox identities cold-start PowerShell on hosted runners.
          # This timeout covers the complete spec file, including that startup.
          & $env:NEOAGENT_NVIM --headless --noplugin `
            -u tests/minimal_init.lua `
            -c "PlenaryBustedDirectory tests/windows { minimal_init = './tests/minimal_init.lua', sequential = true, timeout = 240000 }"
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) {
            throw "Windows tests failed (Neovim exit code $testExit)"
          }
      - name: Run portable core and API suites
        shell: pwsh
        run: |
          $specs = @(
            "async", "agent_loop", "model", "semantic_message",
            "api_messages", "tool_schema", "sse", "http",
            "openai_completions", "openai_responses", "anthropic_messages",
            "openai_codex_responses", "api_timeouts", "model_rules", "thinking"
          )
          foreach ($spec in $specs) {
            & $env:NEOAGENT_NVIM --headless --noplugin `
              -u tests/minimal_init.lua `
              -c "lua require('plenary.busted').run('tests/unit/${spec}_spec.lua')"
            if ($LASTEXITCODE -ne 0) {
              throw "Portable suite $spec failed (Neovim exit code $LASTEXITCODE)"
            }
          }
